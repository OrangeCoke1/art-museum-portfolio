<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gallery Walk — Photography 横向摄影展厅" />
    <title>Gallery Walk · Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile-modal.css" />
    <link rel="stylesheet" href="photography.css" />
  </head>
  <body class="app-shell photography-shell">
    <header class="site-header" id="top">
      <a class="logo" href="index.html">
        <img
          class="logo-img"
          src="images/logo.png"
          alt="Gallery Walk"
          width="160"
          height="40"
        />
      </a>

      <nav class="site-nav" aria-label="主导航">
        <a href="gallery.html" class="site-nav__link" data-nav="painting"
          >Painting</a
        >
        <a href="sculpture.html" class="site-nav__link" data-nav="sculpture"
          >Sculpture</a
        >
        <a
          href="photography.html"
          class="site-nav__link is-active"
          data-nav="photography"
          >Photography</a
        >
        <a href="about.html" class="site-nav__link" data-nav="about">About</a>
      </nav>

      <div class="header-actions">
        <button
          type="button"
          class="icon-btn"
          id="btnSearch"
          aria-label="搜索摄影作品"
        >
          <svg
            class="icon-btn__svg"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              d="M16 16l5 5"
            />
          </svg>
        </button>
        <div class="language-switcher">
          <button
            type="button"
            class="language-toggle"
            aria-expanded="false"
            aria-controls="languageMenu"
          >
            English
          </button>
          <div class="language-menu" id="languageMenu" hidden>
            <button type="button" data-lang-option="en">English</button>
            <button type="button" data-lang-option="ja">日本語</button>
            <button type="button" data-lang-option="zh-CN">简体中文</button>
            <button type="button" data-lang-option="zh-TW">繁體中文</button>
            <button type="button" data-lang-option="fr">Français</button>
            <button type="button" data-lang-option="es">Español</button>
          </div>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="btnMenu"
          aria-label="打开菜单"
          aria-expanded="false"
          aria-controls="mobileNav"
        >
          <svg
            class="icon-btn__svg"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
          >
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              d="M4 7h16M4 12h16M4 17h16"
            />
          </svg>
        </button>
      </div>
    </header>

    <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航" hidden>
      <a href="gallery.html" class="site-nav__link" data-nav="painting"
        >Painting</a
      >
      <a href="sculpture.html" class="site-nav__link" data-nav="sculpture"
        >Sculpture</a
      >
      <a
        href="photography.html"
        class="site-nav__link is-active"
        data-nav="photography"
        >Photography</a
      >
      <a href="about.html" class="site-nav__link" data-nav="about">About</a>
    </nav>

    <main class="app-main photography-page">
      <section class="gallery-section photography-section" aria-label="Photography gallery">
        <div class="gallery-hall photography-hall" id="photographyHall" tabindex="0">
          <div class="gallery-track photography-track" id="photographyTrack"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer photography-footer" id="about">
      <div class="scroll-progress-wrap">
        <label class="scroll-progress-label" for="scrollProgress" data-i18n="progressPhotography"
          >展示进度</label
        >
        <div class="scroll-progress-bar" role="presentation">
          <div class="scroll-progress-fill" id="scrollProgressFill"></div>
          <input
            class="scroll-progress-input"
            id="scrollProgress"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Gallery scroll progress"
          />
        </div>
        <p class="footer-copy" data-i18n="footerPhotography">Gallery Walk · Photography wall experience</p>
      </div>
    </footer>

    <div
      class="modal"
      id="artModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      hidden
    >
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-panel" role="document">
        <div class="modal-body museum-modal-layout">
          <aside class="modal-sidebar" aria-label="Artwork information">
            <div class="modal-sidebar-head">
              <h2 class="modal-title" id="modalTitle"></h2>
              <p class="modal-subtitle" id="modalSubtitle"></p>
            </div>
            <div
              class="modal-info-card"
              id="modalInfoCard"
              role="button"
              tabindex="0"
              aria-label="Flip artwork information card"
            >
              <div class="modal-info-card__inner">
                <div class="modal-info-card__face modal-info-card__front">
                  <dl class="modal-meta"></dl>
                  <button
                    class="modal-info-card__flip"
                    type="button"
                    id="modalFlipToBack"
                    aria-label="Show artwork story"
                  >
                    <span data-i18n="readBackground">Read background</span>
                  </button>
                </div>
                <div class="modal-info-card__face modal-info-card__back">
                  <p class="modal-story-label" data-i18n="backgroundLabel">Background</p>
                  <h3 class="modal-story-title" id="modalStoryTitle"></h3>
                  <p class="modal-story-text" id="modalStoryText"></p>
                  <button
                    class="modal-info-card__flip"
                    type="button"
                    id="modalFlipToFront"
                    aria-label="Show artwork details"
                  >
                    <span data-i18n="backToDetails">Back to details</span>
                  </button>
                </div>
              </div>
            </div>
            <a
              class="modal-museum-btn"
              id="modalLink"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="modal-museum-btn__icon"
                src="images/museum.png"
                alt=""
                width="18"
                height="18"
                aria-hidden="true"
              />
              <span data-i18n="visitMuseum">Visit Museum Website</span>
              <img
                class="modal-museum-btn__external"
                src="images/link.png"
                alt=""
                width="16"
                height="16"
                aria-hidden="true"
              />
            </a>
          </aside>
          <section
            class="modal-viewer"
            id="modalViewer"
            aria-label="Photography image viewer"
          >
            <div
              class="modal-toolbar"
              role="toolbar"
              aria-label="Artwork viewer tools"
            >
              <button
                type="button"
                class="modal-tool is-active"
                id="modalBtnView"
                aria-label="View mode"
                aria-pressed="true"
                title="View"
                data-tool="view"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="1.4" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
                  <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4" />
                </svg>
              </button>
              <button
                type="button"
                class="modal-tool"
                id="modalBtnPan"
                aria-label="Pan mode"
                aria-pressed="false"
                title="Pan"
                data-tool="pan"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M9 11V6.5a2.5 2.5 0 1 1 5 0V11M12 11v7M8 15h8" />
                </svg>
              </button>
              <button
                type="button"
                class="modal-tool"
                id="modalBtnFit"
                aria-label="Fit to window"
                aria-pressed="false"
                title="Fit to window"
                data-tool="fit"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <rect x="5" y="5" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.4" />
                </svg>
              </button>
              <button
                type="button"
                class="modal-tool"
                id="modalBtnFullscreen"
                aria-label="Fullscreen"
                title="Fullscreen"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
                </svg>
              </button>
              <button
                type="button"
                class="modal-tool modal-tool--close"
                data-close-modal
                aria-label="Close"
                title="Close"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
            </div>
            <div class="modal-stage" id="modalStage">
              <div class="modal-stage-inner" id="modalStageInner">
                <img
                  class="modal-image"
                  id="modalImage"
                  src=""
                  alt=""
                  draggable="false"
                />
              </div>
            </div>
            <p class="modal-hint" data-i18n="hintImage">
              Drag to move · Scroll to zoom · Double click to reset
            </p>
          </section>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="mobile-modal.js"></script>
    <script src="photography.js"></script>
  </body>
</html>
