<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La Liberté guidant le peuple — 光标柔光显色" />
    <title>自由引导人民 · Gallery Walk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .liberty-page {
        min-height: 100vh;
        margin: 0 auto;
        padding: 1.25rem clamp(1rem, 4vw, 2.5rem) 3rem;
        max-width: 960px;
        box-sizing: border-box;
        background: var(--wall, #eae4d8);
        color: var(--text, #1c1815);
      }

      .liberty-page__back {
        display: inline-block;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        color: inherit;
        text-decoration: none;
        opacity: 0.78;
        margin-bottom: 1.5rem;
      }

      .liberty-page__back:hover,
      .liberty-page__back:focus-visible {
        opacity: 1;
        outline: none;
      }

      .liberty-page__head {
        margin-bottom: 1.5rem;
      }

      .liberty-page__title {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        font-weight: 600;
        line-height: 1.15;
      }

      .liberty-page__meta {
        margin: 0.6rem 0 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.95rem;
        color: var(--muted, #585045);
      }

      .liberty-page__viewer-wrap {
        position: relative;
        display: block;
        max-width: 100%;
        margin: 0 auto;
        background: rgba(255, 255, 252, 0.4);
        box-shadow:
          inset 0 0 0 1px rgba(44, 36, 24, 0.08),
          0 16px 48px rgba(25, 20, 12, 0.1);
        border-radius: 4px;
        overflow: hidden;
        line-height: 0;
      }

      .liberty-viewer {
        position: relative;
        display: inline-block;
        width: 100%;
        max-width: 100%;
        vertical-align: top;
        touch-action: none;
        cursor: crosshair;
      }

      .liberty-viewer .liberty-color {
        display: block;
        width: 100%;
        height: auto;
        max-height: min(78vh, 820px);
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .liberty-viewer .liberty-veil {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      .liberty-page__hint {
        margin: 1rem 0 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.05em;
        color: var(--muted, #585045);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="liberty-page">
      <a class="liberty-page__back" href="gallery.html">← 返回展厅</a>
      <header class="liberty-page__head">
        <h1 class="liberty-page__title">La Liberté guidant le peuple</h1>
        <p class="liberty-page__meta">Eugène Delacroix · 1830 · 布面油画</p>
      </header>

      <div class="liberty-page__viewer-wrap">
        <div
          class="liberty-viewer"
          data-white-src="images/liberty-white.png"
          role="img"
          aria-label="《自由引导人民》：移动光标以柔光擦除白膜显色"
        >
          <img
            class="liberty-color"
            src="images/liberty-color.jpg"
            alt="La Liberté guidant le peuple"
            width="1200"
            height="900"
            loading="eager"
            decoding="async"
          />
          <canvas class="liberty-veil" aria-hidden="true"></canvas>
        </div>
      </div>
      <p class="liberty-page__hint">移动指针擦过画面，以柔光逐步显色（与展厅曾用的白膜逻辑相同）</p>
    </div>

    <script src="liberty-reveal.js"></script>
    <script>
      if (typeof initAllLibertyReveal === "function") {
        initAllLibertyReveal();
      }
    </script>
  </body>
</html>
